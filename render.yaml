# Render.com Blueprint Configuration
# This file enables auto-deploy and PR previews for your Online Bookstore

services:
  # Web Application
  - type: web
    name: online-bookstore
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      # Database Configuration - FreeSQLDatabase
      - key: DB_HOST
        value: sql12.freesqldatabase.com
      - key: DB_NAME
        value: sql12815923
      - key: DB_USER
        value: sql12815923
      - key: DB_PASSWORD
        value: gJUmV8zau4
      
      # Application Settings
      - key: SITE_URL
        value: https://online-bookstore.onrender.com
      - key: TAX_RATE
        value: "0.085"
      
      # Security
      - key: SESSION_TIMEOUT
        value: "7200"
      - key: CSRF_TOKEN_EXPIRE
        value: "3600"
      
      # SMTP Email Configuration
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false  # Set manually in Render dashboard
      - key: SMTP_PASSWORD
        sync: false  # Set manually in Render dashboard
      - key: SMTP_FROM_EMAIL
        value: noreply@nightowlbooks.com
      - key: SMTP_FROM_NAME
        value: Night Owl Books
      - key: SMTP_ENCRYPTION
        value: tls
